<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Книжковий Магазин</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header -->
  <header class="bg-indigo-950 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-book-open text-yellow-400 text-2xl"></i>
        <h1 class="font-bold text-xl tracking-wide hidden sm:block">BookStore</h1>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-md relative">
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Пошук за назвою або автором..." 
          class="w-full pl-9 pr-4 py-2 rounded-xl text-sm bg-indigo-900/60 text-white placeholder-indigo-300 border border-indigo-700 outline-none focus:border-yellow-400 transition">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-indigo-300 text-sm"></i>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-3">
        <!-- Language Switcher -->
        <select onchange="changeLanguage(this.value)" class="bg-indigo-900 border border-indigo-700 text-xs text-white rounded-lg px-2 py-1.5 outline-none cursor-pointer">
          <option value="uk">UA</option>
          <option value="pl">PL</option>
          <option value="en">EN</option>
          <option value="ru">RU</option>
        </select>

        <!-- Wishlist Icon -->
        <button onclick="toggleWishlistModal()" class="relative p-2 text-indigo-200 hover:text-white transition">
          <i class="fa-solid fa-heart text-xl"></i>
          <span id="wishlistCount" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span>
        </button>

        <!-- Cart Icon -->
        <button onclick="toggleCart()" class="relative p-2 text-indigo-200 hover:text-white transition">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span id="cartCount" class="absolute -top-1 -right-1 bg-yellow-400 text-indigo-950 text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span>
        </button>

        <!-- Admin Switcher -->
        <button onclick="toggleAdminView()" class="bg-yellow-400 hover:bg-yellow-500 text-indigo-950 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-user-gear"></i>
          <span id="adminBtnText">Адмінка</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- USER VIEW -->
    <div id="userView" class="space-y-6">
      
      <!-- Filters and Categories Bar -->
      <div class="bg-white p-4 rounded-2xl shadow-sm space-y-4">
        <!-- Categories -->
        <div id="categoriesList" class="flex flex-wrap gap-2"></div>

        <!-- Secondary Filters -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 border-t text-xs">
          <div>
            <label id="optDefault" class="font-bold text-gray-700 block mb-1">Сортування</label>
            <select id="sortSelect" onchange="renderBooks()" class="w-full p-2 border rounded-lg outline-none bg-gray-50">
              <option value="default" id="optDefaultOpt">За замовчуванням</option>
              <option value="price-asc" id="optPriceAsc">Ціна: від найдешевшої</option>
              <option value="price-desc" id="optPriceDesc">Ціна: від найдорожчої</option>
              <option value="discount" id="optDiscount">Спочатку зі знижкою</option>
              <option value="rating-desc" id="optRatingDesc">За рейтингом</option>
            </select>
          </div>

          <div>
            <div class="flex justify-between font-bold text-gray-700 mb-1">
              <span id="lblMaxPrice">Макс. ціна:</span>
              <span id="priceVal">200 zł</span>
            </div>
            <input type="range" id="priceRange" min="10" max="200" value="200" oninput="updatePriceLabel(); renderBooks();" class="w-full accent-indigo-900 cursor-pointer">
          </div>

          <div>
            <label id="lblMinRating" class="font-bold text-gray-700 block mb-1">Мін. рейтинг:</label>
            <select id="ratingFilter" onchange="renderBooks()" class="w-full p-2 border rounded-lg outline-none bg-gray-50">
              <option value="0" id="optAllRatings">Усі оцінки</option>
              <option value="4.5">★ 4.5+</option>
              <option value="4.0">★ 4.0+</option>
              <option value="3.0">★ 3.0+</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Books Grid -->
      <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="adminView" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm">
        <h2 id="adminTitle" class="text-lg font-bold text-gray-900">Панель управління каталогом</h2>
        <button onclick="openAddBookModal()" class="bg-indigo-900 hover:bg-indigo-800 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> <span id="addBookBtnText">Додати книгу</span>
        </button>
      </div>

      <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-gray-50 border-b text-gray-600 uppercase font-semibold">
              <tr>
                <th id="thCover" class="p-4">Обкладинка</th>
                <th id="thTitle" class="p-4">Назва / Автор</th>
                <th id="thCategory" class="p-4">Категорія</th>
                <th id="thPrice" class="p-4">Ціна</th>
                <th id="thDiscount" class="p-4">Знижка</th>
                <th id="thActions" class="p-4">Дії</th>
              </tr>
            </thead>
            <tbody id="adminBooksTable" class="divide-y"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <!-- CART DRAWER -->
  <div id="cartDrawer" class="fixed inset-0 z-50 hidden">
    <div onclick="toggleCart()" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="absolute right-0 top-0 h-full max-w-xs w-full bg-white shadow-2xl p-6 flex flex-col justify-between z-10">
      <div>
        <div class="flex justify-between items-center pb-4 border-b">
          <h3 id="cartHeading" class="font-bold text-lg">Кошик</h3>
          <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div id="cartItems" class="mt-4 space-y-4 max-h-[60vh] overflow-y-auto"></div>
      </div>
      <div class="pt-4 border-t">
        <div class="flex justify-between items-center font-bold text-base mb-4">
          <span id="cartTotalLabel">Разом до сплати:</span>
          <span id="cartTotal" class="text-indigo-900">0.00 zł</span>
        </div>
        <button onclick="checkout()" id="checkoutBtn" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white py-3 rounded-xl font-bold text-sm transition">
          Оформити замовлення
        </button>
      </div>
    </div>
  </div>

  <!-- WISHLIST MODAL -->
  <div id="wishlistModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div onclick="toggleWishlistModal()" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl z-10">
      <div class="flex justify-between items-center mb-4">
        <h3 id="wishlistModalTitle" class="font-bold text-lg">Список обраного</h3>
        <button onclick="toggleWishlistModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div id="wishlistItems" class="space-y-3 max-h-[60vh] overflow-y-auto"></div>
    </div>
  </div>

  <!-- BOOK DETAILS MODAL -->
  <div id="bookModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div onclick="closeBookModal()" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div id="bookModalContent" class="relative bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl z-10 max-h-[90vh] overflow-y-auto"></div>
  </div>

  <!-- ADD / EDIT BOOK MODAL -->
  <div id="addBookModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div onclick="closeAddBookModal()" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl z-10 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="addBookModalTitle" class="text-lg font-bold text-gray-900">Додати нову книгу</h3>
        <button onclick="closeAddBookModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      
      <form id="addBookForm" onsubmit="handleSaveBook(event)" class="space-y-3">
        <input type="hidden" id="editingBookId" value="">
        
        <div>
          <label id="lblTitle" class="text-xs font-bold text-gray-700 block mb-1">Назва книги</label>
          <input type="text" id="newTitle" required class="w-full p-2 border rounded-lg text-sm outline-none focus:border-indigo-600">
        </div>
        <div>
          <label id="lblAuthor" class="text-xs font-bold text-gray-700 block mb-1">Автор</label>
          <input type="text" id="newAuthor" required class="w-full p-2 border rounded-lg text-sm outline-none focus:border-indigo-600">
        </div>
        <div>
          <label id="lblCategory" class="text-xs font-bold text-gray-700 block mb-1">Категорія</label>
          <input type="text" id="newCategory" required class="w-full p-2 border rounded-lg text-sm outline-none focus:border-indigo-600">
        </div>

        <div class="flex items-center gap-2 py-1">
          <input type="checkbox" id="newIsOnOrder" onchange="togglePriceFields(this.checked)" class="w-4 h-4 accent-indigo-900 rounded cursor-pointer">
          <label for="newIsOnOrder" id="lblIsOnOrder" class="text-xs font-bold text-indigo-900 cursor-pointer">Під замовлення (без ціни)</label>
        </div>

        <div id="priceFieldsGroup" class="grid grid-cols-2 gap-3">
          <div>
            <label id="lblPrice" class="text-xs font-bold text-gray-700 block mb-1">Ціна (zł)</label>
            <input type="number" step="0.01" id="newPrice" class="w-full p-2 border rounded-lg text-sm outline-none focus:border-indigo-600">
          </div>
          <div>
            <label id="lblDiscount" class="text-xs font-bold text-gray-700 block mb-1">Знижка (%)</label>
            <input type="number" id="newDiscount" value="0" min="0" max="99" class="w-full p-2 border rounded-lg text-sm outline-none focus:border-indigo-600">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label id="lblRating" class="text-xs font-bold text-gray-700 block mb-1">Рейтинг (1-5)</label>
            <input type="number" step="0.1" min="1" max="5" id="newRating" value="5.0" required class="w-full p-2 border rounded-lg text-sm outline-none focus:border-indigo-600">
          </div>
          <div>
            <label id="lblImage" class="text-xs font-bold text-gray-700 block mb-1">Обкладинка (URL)</label>
            <input type="url" id="newImage" required class="w-full p-2 border rounded-lg text-sm outline-none focus:border-indigo-600">
          </div>
        </div>
        <div>
          <label id="lblDesc" class="text-xs font-bold text-gray-700 block mb-1">Опис</label>
          <textarea id="newDesc" rows="2" class="w-full p-2 border rounded-lg text-sm outline-none focus:border-indigo-600"></textarea>
        </div>
        
        <button type="submit" id="saveBookBtn" class="w-full bg-indigo-900 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-indigo-800 transition mt-2">
          Зберегти книгу
        </button>
      </form>
    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div id="checkoutModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div onclick="closeCheckoutModal()" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl z-10">
      <div class="flex justify-between items-center mb-4">
        <h3 id="checkoutModalTitle" class="text-lg font-bold text-gray-900">Оформлення замовлення</h3>
        <button onclick="closeCheckoutModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <form id="checkoutForm" onsubmit="handleCheckoutSubmit(event)" class="space-y-3">
        <div>
          <label id="lblCustomerName" class="text-xs font-bold text-gray-700 block mb-1">Ім'я та Прізвище</label>
          <input type="text" required class="w-full p-2 border rounded-lg text-sm outline-none focus:border-indigo-600">
        </div>
        <div>
          <label id="lblCustomerPhone" class="text-xs font-bold text-gray-700 block mb-1">Номер телефону</label>
          <input type="tel" required class="w-full p-2 border rounded-lg text-sm outline-none focus:border-indigo-600">
        </div>
        <div>
          <label id="lblCustomerAddress" class="text-xs font-bold text-gray-700 block mb-1">Адреса доставки</label>
          <input type="text" required class="w-full p-2 border rounded-lg text-sm outline-none focus:border-indigo-600">
        </div>
        <div>
          <label id="lblPaymentMethod" class="text-xs font-bold text-gray-700 block mb-1">Спосіб оплати</label>
          <select class="w-full p-2 border rounded-lg text-sm outline-none bg-white font-semibold">
            <option id="optPayCard">Карткою онлайн</option>
            <option id="optPayBlik">BLIK</option>
            <option id="optPayCash">При отриманні</option>
          </select>
        </div>

        <div class="flex justify-between items-center pt-2 border-t font-bold">
          <span id="lblConfirmTotal" class="text-sm">Сума:</span>
          <span id="checkoutModalTotal" class="text-indigo-900 text-lg">0.00 zł</span>
        </div>

        <button type="submit" id="confirmOrderBtn" class="w-full bg-indigo-900 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-indigo-800 transition mt-2">
          Підтвердити замовлення
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script src="script.js"></script>
</body>
</html>
